# Render "Blueprint" for the SiteSentry portal (docs/portal.md). https://render.com/docs/blueprint-spec
# The boxes themselves run on site (Jetson), not here.
services:
  - type: web
    name: sitesentry-portal
    runtime: docker
    dockerfilePath: ./portal/Dockerfile
    dockerContext: .
    plan: free                # sleeps after 15 minutes without visitors; the first visit then takes ~30-60 s
    region: frankfurt         # same region as the database
    healthCheckPath: /health
    buildFilter:
      paths: ["portal/**", "frontend/**", "render.yaml"]
    envVars:
      # the address people open; passkeys are tied to it, so set it once and keep it
      - key: PORTAL_URL
        value: https://sitesentry-portal.onrender.com
      - key: OVERSEER_NAME
        value: Albaraa Farag
      # Secrets and personal details: typed into the Render dashboard, never stored in this file.
      - key: DATABASE_URL       # Postgres connection string (Supabase session pooler, or Neon)
        sync: false
      - key: OVERSEER_EMAIL     # first start prints the overseer's one-time setup link in the Render log
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
