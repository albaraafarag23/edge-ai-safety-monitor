# Ports are bound to 127.0.0.1 only: nothing is reachable from the network except through the
# public tunnel (Tailscale Funnel -> localhost:3000, see docs/deploy.md). The database, Redis and the
# API stay private; the browser reaches the API through the website's /api.
services:

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safety_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitor} -d ${POSTGRES_DB:-safety_monitor}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cv_pipeline:
    build: ./cv_pipeline
    environment:
      REDIS_URL: redis://redis:6379
      SOURCE: ${CV_SOURCE:-0}
      MODELS_DIR: /models
      PLUGINS_DIR: /app/plugins
      MEDIA_DIR: /media
      CAMERA_ID: cam_01
      CAMERA_LOCATION: ${CAMERA_LOCATION:-Main site}
      PLUGIN_ID: ${PLUGIN_ID:-construction_safety}
      TEST_MODE: ${CV_TEST_MODE:-true}
    volumes:
      # trained models (construction_ppe.pt, smoking.pt, ...), see training/README.md
      - ./models:/models:ro
      - ./plugins:/app/plugins:ro
      - ./media:/media
    devices:
      - /dev/video0:/dev/video0
    # For GPU inference (requires NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  event_engine:
    build: ./event_engine
    environment:
      REDIS_URL: redis://redis:6379
      PLUGINS_DIR: /app/plugins
      # rule working hours (set in the console) are in this time zone
      SITE_TIMEZONE: ${SITE_TIMEZONE:-Africa/Cairo}
    volumes:
      - ./plugins:/app/plugins:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-monitor}:${POSTGRES_PASSWORD:-monitor123}@postgres:5432/${POSTGRES_DB:-safety_monitor}
      MEDIA_DIR: /media
      # dashboard sign-in (see backend/auth.py). The first start creates ADMIN_EMAIL with ADMIN_PASSWORD.
      AUTH_SECRET: ${AUTH_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      # the rules page lists this plugin's rules (settings: backend/rule_settings.py)
      PLUGINS_DIR: /app/plugins
      PLUGIN_ID: ${PLUGIN_ID:-construction_safety}
      SITE_TIMEZONE: ${SITE_TIMEZONE:-Africa/Cairo}
    volumes:
      - ./media:/media:ro
      - ./plugins:/app/plugins:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai_reporting:
    build: ./ai_reporting
    environment:
      REDIS_URL: redis://redis:6379
      BACKEND_URL: http://backend:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      PLUGINS_DIR: /app/plugins
      MEDIA_DIR: /media
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SUPERVISOR_EMAILS: ${SUPERVISOR_EMAILS:-}
      NOTIFY_COOLDOWN_S: ${NOTIFY_COOLDOWN_S:-300}
    volumes:
      - ./plugins:/app/plugins:ro
      - ./media:/media:ro
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
