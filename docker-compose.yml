# Ports are bound to 127.0.0.1 only: nothing is reachable from the network except through the
# public tunnel (Tailscale Funnel -> localhost:3000, see docs/deploy.md). The database, Redis and the
# API stay private; the browser reaches the API through the website's /api.
# Container logs are capped (3 files of 10 MB per service): on a device that runs for months, unlimited
# logs fill the disk.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  redis:
    <<: *logging
    image: redis:7-alpine
    # append-only file on a volume: queued detections, incidents and email retries survive a restart or power cut
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    <<: *logging
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safety_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitor} -d ${POSTGRES_DB:-safety_monitor}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cv_pipeline:
    <<: *logging
    build: ./cv_pipeline
    environment:
      REDIS_URL: redis://redis:6379
      SOURCE: ${CV_SOURCE:-0}
      MODELS_DIR: /models
      PLUGINS_DIR: /app/plugins
      # where the rules come from: fixed (PLUGIN_ID) or drive (a signed rule drive, docs/plugin-drives.md)
      PLUGIN_SOURCE: ${PLUGIN_SOURCE:-fixed}
      MEDIA_DIR: /media
      # days to keep incident snapshots and clips; empty = forever
      MEDIA_KEEP_DAYS: ${MEDIA_KEEP_DAYS:-}
      # several cameras: config/cameras.json (see config/cameras.example.json). Without it, the one camera below.
      CAMERAS_FILE: /config/cameras.json
      # face recognition: enrolled photos (console > People) and its switch (auto = on when the models are there)
      FACES_DIR: /faces
      FACE_RECOGNITION: ${FACE_RECOGNITION:-auto}
      FACE_DEVICE: ${FACE_DEVICE:-cpu}
      # 1 = print frames per second and milliseconds per stage every 10 s (for finding slow spots)
      CV_PROFILE: ${CV_PROFILE:-}
      # live view: pictures a second, and their JPEG quality (lighter = smoother over a slow upload line)
      LIVE_FPS: ${LIVE_FPS:-}
      LIVE_QUALITY: ${LIVE_QUALITY:-}
      # v4l2 controls set each time the camera opens. exposure_dynamic_framerate=0 stops the camera halving its
      # frame rate in dim light (the picture gets darker instead); empty = the detector's default (50 Hz only)
      CAMERA_CONTROLS: ${CAMERA_CONTROLS:-}
      # frames a second asked of a USB camera (30; 60 when a sharp 1080p picture loses frames, jetson/README.md)
      CAMERA_FPS: ${CAMERA_FPS:-}
      CAMERA_ID: cam_01
      CAMERA_LOCATION: ${CAMERA_LOCATION:-Main site}
      PLUGIN_ID: ${PLUGIN_ID:-construction_safety}
      TEST_MODE: ${CV_TEST_MODE:-true}
    volumes:
      # trained models (construction_ppe.pt, smoking.pt, ...), see training/README.md
      - ./models:/models:ro
      - ./plugins:/app/plugins:ro
      - plugin_slot:/plugin_slot:ro
      - ./media:/media
      - ./config:/config:ro
      - ./faces:/faces:ro
    devices:
      - /dev/video0:/dev/video0
    # For GPU inference (requires NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  event_engine:
    <<: *logging
    build: ./event_engine
    environment:
      REDIS_URL: redis://redis:6379
      PLUGINS_DIR: /app/plugins
      # where the rules come from: fixed (PLUGIN_ID) or drive (a signed rule drive, docs/plugin-drives.md)
      PLUGIN_SOURCE: ${PLUGIN_SOURCE:-fixed}
      # rule working hours (set in the console) are in this time zone
      SITE_TIMEZONE: ${SITE_TIMEZONE:-Africa/Cairo}
      # how strong a face match must be to count someone in the per-person tally (docs/faces.md)
      TALLY_MIN_FACE_SCORE: ${TALLY_MIN_FACE_SCORE:-0.50}
    volumes:
      - ./plugins:/app/plugins:ro
      - plugin_slot:/plugin_slot:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  backend:
    <<: *logging
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment: &backend-env
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-monitor}:${POSTGRES_PASSWORD:-monitor123}@postgres:5432/${POSTGRES_DB:-safety_monitor}
      MEDIA_DIR: /media
      # dashboard sign-in (see backend/auth.py). The first start creates ADMIN_EMAIL (a manager) with ADMIN_PASSWORD.
      AUTH_SECRET: ${AUTH_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # the SiteSentry portal (docs/portal.md): empty = this box works on its own. BOX_SERIAL: its name there.
      PORTAL_URL: ${PORTAL_URL:-}
      # what people's browsers open (when the box reaches the portal by another, internal address)
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-}
      # risky changes on the console ask "confirm it's you" first: auto = when linked to the portal
      CONFIRM_CHANGES: ${CONFIRM_CHANGES:-auto}
      BOX_SERIAL: ${BOX_SERIAL:-}
      PORTAL_CHECKIN_S: ${PORTAL_CHECKIN_S:-60}
      # the shared read-only account for visitors; both empty = there is none (backend/auth.py ensure_demo)
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # the console's public address: changes are only accepted from the console's own pages (backend/main.py)
      CONSOLE_URL: ${CONSOLE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # face photos of the people to recognise (console > People), read by the detector
      FACES_DIR: /faces
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      # the rules page lists this plugin's rules (settings: backend/rule_settings.py)
      PLUGINS_DIR: /app/plugins
      # where the rules come from: fixed (PLUGIN_ID) or drive (a signed rule drive, docs/plugin-drives.md)
      PLUGIN_SOURCE: ${PLUGIN_SOURCE:-fixed}
      PLUGIN_ID: ${PLUGIN_ID:-construction_safety}
      SITE_TIMEZONE: ${SITE_TIMEZONE:-Africa/Cairo}
    volumes:
      - ./media:/media:ro
      - ./plugins:/app/plugins:ro
      - plugin_slot:/plugin_slot:ro
      - ./faces:/faces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The console's live camera view (WebSocket), in its own process on its own CPU core: streaming pictures to
  # many viewers then can't slow the rest of the console down, nor the other way round. Same code as `backend`,
  # started with BACKEND_ROLE=live (only the live view; no background work). nginx sends /api/cameras/*/live here.
  live:
    <<: *logging
    build: ./backend
    environment:
      <<: *backend-env
      BACKEND_ROLE: live
      LIVE_WINDOW: ${LIVE_WINDOW:-}   # pictures in flight per viewer (backend/cameras.py, default 4)
    volumes:
      - ./plugins:/app/plugins:ro
      - plugin_slot:/plugin_slot:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai_reporting:
    <<: *logging
    build: ./ai_reporting
    environment:
      REDIS_URL: redis://redis:6379
      BACKEND_URL: http://backend:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      PLUGINS_DIR: /app/plugins
      # where the rules come from: fixed (PLUGIN_ID) or drive (a signed rule drive, docs/plugin-drives.md)
      PLUGIN_SOURCE: ${PLUGIN_SOURCE:-fixed}
      MEDIA_DIR: /media
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # or Gemini (the key SiteSentry Regs uses), when there is no Claude key; LLM_PROVIDER=claude|gemini picks one
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SUPERVISOR_EMAILS: ${SUPERVISOR_EMAILS:-}
      EMAIL_MIN_SEVERITY: ${EMAIL_MIN_SEVERITY:-HIGH}
      NOTIFY_COOLDOWN_S: ${NOTIFY_COOLDOWN_S:-300}
      RETRY_GIVE_UP_S: ${RETRY_GIVE_UP_S:-86400}
      # alert emails: times in site time, and an "Open this incident" button to the public console
      SITE_TIMEZONE: ${SITE_TIMEZONE:-Africa/Cairo}
      CONSOLE_URL: ${CONSOLE_URL:-}
      # reports are written in English and Arabic ("en" = English only); emails go out in EMAIL_LANGUAGE
      REPORT_LANGUAGES: ${REPORT_LANGUAGES:-en,ar}
      EMAIL_LANGUAGE: ${EMAIL_LANGUAGE:-en}
      # end-of-day summary email at this site time, e.g. "18:00"; empty = off
      DIGEST_TIME: ${DIGEST_TIME:-}
    volumes:
      - ./plugins:/app/plugins:ro
      - plugin_slot:/plugin_slot:ro
      - ./media:/media:ro
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    <<: *logging
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Watches the USB ports for a signed rule drive and puts its rule set into plugin_slot (docs/plugin-drives.md).
  # Only with PLUGIN_SOURCE=drive and COMPOSE_PROFILES=drives. Privileged: it mounts drives (read-only, noexec).
  plugin_loader:
    <<: *logging
    build: ./plugin_loader
    profiles: ["drives"]
    privileged: true
    environment:
      REDIS_URL: redis://redis:6379
      PLUGIN_KEYS_DIR: /keys
      # true: a drive's rules run only if this box's portal licence names them (docs/portal.md)
      LICENCE_REQUIRED: ${LICENCE_REQUIRED:-false}
    volumes:
      - plugin_slot:/plugin_slot
      - ./config/plugin_keys:/keys:ro
      - /dev:/dev
      - /sys:/sys:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  plugin_slot:
