server {
    listen 80;
    root /usr/share/nginx/html;

    # API, media and live events -> backend (same origin, so no CORS in production)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        # Server-Sent Events: don't buffer, keep the connection open
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        client_max_body_size 5m;
    }

    # Single-page app: unknown paths serve index.html, the router handles them
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
